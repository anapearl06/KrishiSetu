<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSetu | Profile Settings</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[#F4F8F0] text-[#181D17] font-['Inter'] min-h-screen flex flex-col lg:flex-row"
  >
    <!-- DESKTOP SIDEBAR -->
    <aside
      class="hidden lg:flex flex-col w-64 sidebar-glass border-r border-[#CDBDB4]/50 min-h-screen p-5 fixed left-0 top-0 bottom-0 z-40 ksetu-slide-in"
    >
      <a href="./index.html" class="brand flex items-center gap-3 mb-8 px-2">
        <img
          src="./assets/images/krishisetu_logo.png"
          alt="Logo"
          class="brand-logo w-10 h-10"
        />
        <span class="brand-name text-xl font-bold">KrishiSetu</span>
      </a>
      <!-- LANGUAGE SWITCHER IN SIDEBAR -->
      <div class="mb-4 px-2">
        <div class="lang-switcher w-full justify-between">
          <button type="button" class="lang-btn active flex-1 justify-center" data-lang="en">EN</button>
          <button type="button" class="lang-btn flex-1 justify-center" data-lang="hi">हिन्दी</button>
        </div>
      </div>

      <nav class="flex flex-col gap-2 flex-1">
        <a
          href="./farmer-dashboard.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">📊</span> <span data-i18n="dashboard">Dashboard</span>
        </a>
        <a
          href="./profile.html"
          class="nav-item-warm active flex items-center gap-3 px-4 py-3 rounded-xl font-medium shadow-sm"
        >
          <span class="text-lg">👤</span> <span data-i18n="accountProfile">Account Profile</span>
        </a>
      </nav>
      <div class="border-t border-[#CDBDB4]/50 pt-4">
        <a
          href="./login.html"
          onclick="localStorage.clear()"
          class="flex items-center gap-2 text-xs font-bold text-red-600 hover:underline"
          data-i18n="logout"
        >
          <span>🚪</span> Logout Account
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 lg:ml-64 pb-20 lg:pb-8">
      <header
        class="bg-white/90 backdrop-blur-xl border-b border-[#CDBDB4]/50 sticky top-0 z-30 px-4 md:px-8 py-5 flex items-center justify-between gap-4"
      >
        <div>
          <h1 class="text-2xl md:text-3xl font-bold brand-name" data-i18n="profileSettings">
            Account Profile Settings
          </h1>
          <p class="text-sm text-[#40493D] mt-1">
            Manage your registered contact and location information
          </p>
        </div>
        <div class="lang-switcher lg:hidden">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="hi">हि</button>
        </div>
      </header>

      <main class="max-w-4xl mx-auto px-4 md:px-8 py-6">
        <div
          class="glass-card rounded-2xl p-6 md:p-8 shadow-sm space-y-6"
        >
          <div class="flex items-center gap-4 pb-6 border-b border-[#CDBDB4]/50">
            <div
              class="w-16 h-16 rounded-full bg-gradient-to-br from-[#0D631B] to-[#4CAF50] flex items-center justify-center text-2xl font-bold text-white shadow-lg"
              id="profileAvatar"
            >
              👤
            </div>
            <div>
              <h2
                class="text-xl font-bold text-[#181D17]"
                id="profileNameDisplay"
              >
                User Account
              </h2>
              <span
                class="status-badge accepted mt-1"
                id="profileRoleBadge"
                data-i18n="verifiedUser"
                >VERIFIED USER</span
              >
            </div>
          </div>

          <form id="profileForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-[#40493D] mb-1" data-i18n="fullName"
                  >Full Name / Organization</label
                >
                <input
                  type="text"
                  id="profileName"
                  required
                  class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold text-[#40493D] mb-1" data-i18n="phone"
                  >Mobile Number</label
                >
                <input
                  type="tel"
                  id="profilePhone"
                  disabled
                  class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm bg-gray-100 text-gray-500 cursor-not-allowed"
                />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div id="businessNameField" class="hidden md:col-span-2">
                <label class="block text-xs font-semibold text-[#40493D] mb-1"
                  >Registered Business Name</label
                >
                <input
                  type="text"
                  id="profileBusiness"
                  class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all"
                />
                <input
                  type="hidden"
                  id="profileBusinessType"
                />
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-[#40493D] mb-1"
                  >State</label
                >
                <input
                  type="text"
                  id="profileState"
                  required
                  class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold text-[#40493D] mb-1"
                  >District / City</label
                >
                <input
                  type="text"
                  id="profileDistrict"
                  required
                  class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all"
                />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-[#40493D] mb-1"
                >Village / Local Address Details</label
              >
              <textarea
                id="profileAddress"
                rows="3"
                class="w-full p-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all"
              ></textarea>
            </div>

            <div class="pt-4 border-t border-[#CDBDB4]/50 flex justify-end">
              <button
                type="submit"
                class="btn-primary px-6 py-2.5 text-white font-bold rounded-xl text-sm shadow-lg flex items-center gap-2"
              >
                💾 Save Profile Updates
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
