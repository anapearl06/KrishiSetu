<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSetu | My Orders (Farmer)</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="role-farmer bg-[#F4F8F0] text-[#181D17] font-['Inter'] min-h-screen flex flex-col lg:flex-row"
  >
    <!-- DESKTOP SIDEBAR -->
    <aside
      class="hidden lg:flex flex-col w-64 app-sidebar min-h-screen p-5 fixed left-0 top-0 bottom-0 z-40 ksetu-slide-in"
    >
      <a href="./index.html" class="brand flex items-center gap-3 mb-8 px-2">
        <img
          src="./assets/images/krishisetu_logo.png"
          alt="Logo"
          class="brand-logo w-10 h-10"
        />
        <span class="brand-name text-xl font-bold">KrishiSetu</span>
      </a>
      <!-- LANGUAGE SWITCHER IN SIDEBAR -->
      <div class="mb-4 px-2">
        <div class="lang-switcher w-full justify-between">
          <button type="button" class="lang-btn active flex-1 justify-center" data-lang="en">EN</button>
          <button type="button" class="lang-btn flex-1 justify-center" data-lang="hi">हिन्दी</button>
        </div>
      </div>

      <nav class="flex flex-col gap-2 flex-1">
        <a
          href="./farmer-dashboard.html"
          class="sidebar-nav"
        >
          <span class="text-lg">📊</span> <span data-i18n="dashboard">Dashboard</span>
        </a>
        <a
          href="./my-listings.html"
          class="sidebar-nav"
        >
          <span class="text-lg">🌾</span> <span data-i18n="myProduce">My Produce</span>
        </a>
        <a
          href="./farmer-offers.html"
          class="sidebar-nav"
        >
          <span class="text-lg">🤝</span> <span data-i18n="offersReceived">Received Offers</span>
        </a>
        <a
          href="./farmer-orders.html"
          class="sidebar-nav active"
        >
          <span class="text-lg">📦</span> <span data-i18n="myOrders">My Orders</span>
        </a>
      </nav>
      <div
        class="border-t border-[#CDBDB4]/50 pt-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-full bg-gradient-to-br from-[#0D631B] to-[#4CAF50] flex items-center justify-center font-bold text-white"
            id="sidebarAvatar"
          >
            F
          </div>
          <div>
            <p class="text-sm font-semibold text-[#181D17]" id="sidebarName">Farmer</p>
            <p class="text-xs text-[#40493D]" id="sidebarEmail" data-i18n="farmerAccount">Farmer Account</p>
          </div>
        </div>
        <a
          href="./login.html"
          class="sidebar-logout text-xs text-red-600 font-medium hover:underline"
          data-i18n="logout"
          >Logout</a
        >
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 lg:ml-64 pb-20 lg:pb-8">
      <header
        class="bg-white/90 backdrop-blur-xl border-b border-[#CDBDB4]/50 sticky top-0 z-30 px-4 md:px-8 py-5 flex items-center justify-between gap-4"
      >
        <div>
          <h1 class="text-2xl md:text-3xl font-bold brand-name" data-i18n="myOrders">
            Confirmed Sales Orders
          </h1>
          <p class="text-sm text-[#40493D] mt-1">
            Track orders generated from accepted offers
          </p>
        </div>
        <div class="flex items-center gap-3">
          <div class="lang-switcher lg:hidden">
            <button type="button" class="lang-btn active" data-lang="en">EN</button>
            <button type="button" class="lang-btn" data-lang="hi">हि</button>
          </div>
          <span
            class="hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-[#0D631B]/10 text-[#0D631B] text-sm font-semibold"
          >
            <span class="w-2 h-2 rounded-full bg-[#0D631B] animate-pulse"></span>
            Active Orders
          </span>
        </div>
      </header>

      <main class="max-w-7xl mx-auto px-4 md:px-8 py-6">
        <div id="farmerOrdersList" class="space-y-4">
          <!-- Populated via script.js -->
        </div>
      </main>
    </div>

    <!-- ORDER DETAILS MODAL (F27) -->
    <div
      id="orderDetailsModal"
      class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="glass-card rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 ksetu-fade-up"
      >
        <div
          class="flex justify-between items-center border-b border-[#CDBDB4]/50 pb-3"
        >
          <h3 class="text-lg font-bold gradient-text-warm">
            Order Details Summary
          </h3>
          <button
            onclick="closeOrderModal()"
            class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center font-bold text-gray-500 transition-all duration-200 hover:scale-110"
          >
            ✕
          </button>
        </div>
        <div id="orderDetailsBody" class="space-y-3 text-sm text-[#181D17]">
          <!-- Populated dynamically via JS -->
        </div>
        <div class="pt-3 border-t border-[#CDBDB4]/50 flex justify-end">
          <button
            onclick="closeOrderModal()"
            class="btn-warm px-5 py-2.5 text-white text-xs font-bold rounded-xl"
          >
            Close Summary
          </button>
        </div>
      </div>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav
      class="lg:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-[#CDBDB4]/50 z-40 flex justify-around py-2.5 px-2 text-center text-xs shadow-[0_-4px_20px_rgba(0,0,0,0.08)]"
    >
      <a
        href="./farmer-dashboard.html"
        class="flex flex-col items-center text-[#0D631B]"
      >
        <span class="text-base">📊</span> Home
      </a>
      <a
        href="./my-listings.html"
        class="flex flex-col items-center text-[#40493D]"
      >
        <span class="text-base">🌾</span> Produce
      </a>
      <a
        href="./farmer-offers.html"
        class="flex flex-col items-center text-[#40493D]"
      >
        <span class="text-base">🤝</span> Offers
      </a>
      <a
        href="./farmer-orders.html"
        class="flex flex-col items-center text-[#0D631B] font-bold"
      >
        <span class="text-base">📦</span> Orders
      </a>
    </nav>

    <script src="./script.js"></script>
  </body>
</html>
