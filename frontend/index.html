<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSetu | Connecting Farmers & Buyers</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-[#FAFAF5] text-[#1E1E1E]">
    <nav
      class="sticky top-0 z-50 w-full bg-[#FAFAF5]/95 backdrop-blur-sm border-b border-[#E0E4DA]"
    >
      <div
        class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between gap-4"
      >
        <a
          href="./index.html"
          class="flex items-center gap-2 shrink-0 transition-transform duration-200 hover:scale-[1.02]"
        >
          <img
            src="./assets/images/krishisetu_logo.png"
            alt="KrishiSetu Logo"
            class="h-9 w-9 object-contain"
          />
          <span class="text-xl md:text-2xl font-bold text-[#0D631B]"
            >KrishiSetu</span
          >
        </a>

        <div class="hidden lg:flex items-center gap-5 xl:gap-6">
          <a
            href="./index.html"
            class="nav-link text-[#0D631B] font-medium border-b-2 border-[#0D631B] pb-1"
            >Home</a
          >
          <a href="#how-it-works" class="nav-link text-[#40493D] font-medium"
            >How It Works</a
          >
          <a href="#farmers" class="nav-link text-[#40493D] font-medium"
            >For Farmers</a
          >
          <a href="#buyers" class="nav-link text-[#40493D] font-medium"
            >For Buyers</a
          >
          <a href="#market-prices" class="nav-link text-[#40493D] font-medium"
            >Market Prices</a
          >
        </div>

        <div class="flex items-center gap-1 sm:gap-2 shrink-0">
          <a
            href="./login.html"
            class="action-link text-[#0D631B] font-medium px-3 sm:px-4 py-2 rounded-md"
            >Login</a
          >
          <a
            href="./register.html"
            class="action-button bg-[#0D631B] text-white font-medium px-4 sm:px-5 py-2.5 rounded-md"
            >Register</a
          >
        </div>
      </div>
    </nav>

    <main>
      <section
        class="relative w-full min-h-[70vh] flex items-center justify-center overflow-hidden"
      >
        <div class="absolute inset-0 z-0">
          <img
            src="./assets/images/background.png"
            alt="Agricultural field"
            class="w-full h-full object-cover"
          />
          <div
            class="absolute inset-0 bg-[#FAFAF5]/80 backdrop-blur-[2px]"
          ></div>
        </div>

        <div
          class="relative z-10 max-w-4xl mx-auto px-4 md:px-8 text-center flex flex-col items-center gap-6 md:gap-8 py-16"
        >
          <h1
            class="text-4xl md:text-6xl font-extrabold text-[#0D631B] tracking-tight"
          >
            Connecting Farmers Directly to Buyers
          </h1>
          <p class="text-lg md:text-xl text-[#40493D] max-w-2xl">
            Empowering agriculture with direct market access, fair pricing, and
            seamless transactions.
          </p>
          <div class="flex flex-wrap items-center justify-center gap-4">
            <a
              href="./register.html?role=farmer"
              class="cta-button bg-[#0D631B] text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:bg-[#095516]"
            >
              Join as Farmer
            </a>
            <a
              href="./register.html?role=buyer"
              class="cta-button bg-[#75584D] text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:bg-[#5c443b]"
            >
              Join as Buyer
            </a>
          </div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
