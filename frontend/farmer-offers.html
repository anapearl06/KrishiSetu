<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSetu | Incoming Offers (Farmer)</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[#F4F8F0] text-[#181D17] font-['Inter'] min-h-screen flex flex-col lg:flex-row"
  >
    <!-- DESKTOP SIDEBAR -->
    <aside
      class="hidden lg:flex flex-col w-64 sidebar-glass border-r border-[#CDBDB4]/50 min-h-screen p-5 fixed left-0 top-0 bottom-0 z-40 ksetu-slide-in"
    >
      <a href="./index.html" class="brand flex items-center gap-3 mb-8 px-2">
        <img
          src="./assets/images/krishisetu_logo.png"
          alt="Logo"
          class="brand-logo w-10 h-10"
        />
        <span class="brand-name text-xl font-bold">KrishiSetu</span>
      </a>
      <nav class="flex flex-col gap-2 flex-1">
        <a
          href="./farmer-dashboard.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">📊</span> Dashboard
        </a>
        <a
          href="./my-listings.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">🌾</span> My Produce
        </a>
        <a
          href="./farmer-offers.html"
          class="nav-item-warm active flex items-center gap-3 px-4 py-3 rounded-xl font-medium shadow-sm"
        >
          <span class="text-lg">🤝</span> Received Offers
        </a>
        <a
          href="./farmer-orders.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">🚚</span> Orders
        </a>
      </nav>
      <div
        class="border-t border-[#CDBDB4]/50 pt-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-full bg-gradient-to-br from-[#0D631B] to-[#4CAF50] flex items-center justify-center font-bold text-white"
            id="sidebarAvatar"
          >
            F
          </div>
          <div>
            <p class="text-sm font-semibold text-[#181D17]" id="sidebarName">Farmer</p>
            <p class="text-xs text-[#40493D]" id="sidebarEmail">Farmer Account</p>
          </div>
        </div>
        <a
          href="./login.html"
          class="sidebar-logout text-xs text-red-600 font-medium hover:underline"
          >Logout</a
        >
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 lg:ml-64 pb-20 lg:pb-8">
      <header
        class="bg-white/90 backdrop-blur-xl border-b border-[#CDBDB4]/50 sticky top-0 z-30 px-4 md:px-8 py-5 flex items-center justify-between"
      >
        <div>
          <h1 class="text-2xl md:text-3xl font-bold brand-name">
            Incoming Offers
          </h1>
          <p class="text-sm text-[#40493D] mt-1">
            Review and accept custom bids placed on your produce
          </p>
        </div>
        <span
          class="hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-[#0D631B]/10 text-[#0D631B] text-sm font-semibold"
        >
          <span class="w-2 h-2 rounded-full bg-[#0D631B] animate-pulse"></span>
          Live Bids
        </span>
      </header>

      <main class="max-w-7xl mx-auto px-4 md:px-8 py-6">
        <div id="farmerOffersList" class="space-y-4">
          <!-- Populated dynamically via script.js -->
        </div>
      </main>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav
      class="lg:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-[#CDBDB4]/50 z-40 flex justify-around py-2.5 px-2 text-center text-xs shadow-[0_-4px_20px_rgba(0,0,0,0.08)]"
    >
      <a
        href="./farmer-dashboard.html"
        class="flex flex-col items-center text-[#0D631B]"
      >
        <span class="text-base">📊</span> Home
      </a>
      <a
        href="./my-listings.html"
        class="flex flex-col items-center text-[#40493D]"
      >
        <span class="text-base">🌾</span> Produce
      </a>
      <a
        href="./farmer-offers.html"
        class="flex flex-col items-center text-[#0D631B] font-bold"
      >
        <span class="text-base">🤝</span> Offers
      </a>
      <a
        href="./farmer-orders.html"
        class="flex flex-col items-center text-[#40493D]"
      >
        <span class="text-base">🚚</span> Orders
      </a>
    </nav>

    <script src="./script.js"></script>
  </body>
</html>
