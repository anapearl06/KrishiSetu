<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#F4F8F0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSetu | Create Account</title>
    <meta name="description" content="Create your free KrishiSetu account to connect directly with verified farmers and buyers across India." />
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    id="registerPage"
    class="register-page min-h-screen bg-[#F4F8F0] text-[#181D17] transition-colors duration-500 font-['Inter']"
  >
    <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
      <img
        src="./assets/images/background.png"
        alt=""
        class="register-background-image absolute inset-0 w-full h-full object-cover opacity-45"
      />
      <div
        id="registerBackgroundOverlay"
        class="absolute inset-0 bg-[#F4F8F0]/55 backdrop-blur-sm transition-colors duration-500"
      ></div>
      <div id="farmScenery" class="farm-scenery"></div>
      <div class="empower-blob b1"></div>
      <div class="empower-blob b2"></div>
    </div>

    <header class="navbar-shell fixed top-0 z-50 w-full h-16 bg-white/90 backdrop-blur border-b border-[#BFCABA]/30">
      <div class="h-full px-4 md:px-8 flex items-center justify-between gap-4 max-w-7xl mx-auto">
        <a href="./index.html" class="brand shrink-0 flex items-center gap-2">
          <img
            src="./assets/images/krishisetu_logo.png"
            alt="KrishiSetu Logo"
            class="brand-logo h-8 w-auto"
          />
          <span class="brand-name text-xl font-bold text-[#0D631B]" data-i18n="brandName">KrishiSetu</span>
        </a>

        <!-- LANGUAGE SWITCHER IN NAVBAR -->
        <div class="lang-switcher">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="hi">हिन्दी</button>
        </div>
      </div>
    </header>

    <main
      class="min-h-screen flex items-center justify-center pt-24 pb-12 px-4"
    >
      <div
        id="registerCard"
        class="register-card auth-panel auth-pad w-full max-w-lg border-[#BFCABA]/60 shadow-xl rounded-2xl bg-white/95 backdrop-blur-md transition-all duration-500"
      >
        <div class="text-center mb-8">
          <h1
            id="registerTitle"
            class="auth-title text-2xl md:text-3xl font-bold text-[#1E1E1E] mb-2"
            data-i18n="createAccount"
          >
            Create an Account
          </h1>
          <p class="text-base text-[#40493D]" data-i18n="joinAgriculturalNetwork">Join the agricultural network</p>
        </div>

        <div
          class="flex mb-6 bg-[#F1F5EB] rounded-xl p-1 gap-1 transition-colors duration-500"
          id="registerTabs"
        >
          <button
            id="registerFarmerTab"
            type="button"
            class="register-role-tab active flex-1 min-h-[44px] rounded-lg px-4 py-2 text-sm font-semibold transition-all duration-200"
            data-i18n="farmer"
          >
            🌾 Farmer
          </button>
          <button
            id="registerBuyerTab"
            type="button"
            class="register-role-tab flex-1 min-h-[44px] rounded-lg px-4 py-2 text-sm font-medium transition-all duration-200"
            data-i18n="buyer"
          >
            🛒 Buyer
          </button>
        </div>

        <!-- FARMER REGISTRATION FORM -->
        <form id="farmerForm" class="flex flex-col gap-4">
          <div>
            <label
              for="farmerName"
              class="block text-sm font-medium text-[#181D17] mb-1"
              data-i18n="fullName"
              >Full Name</label
            >
            <input
              id="farmerName"
              name="farmerName"
              type="text"
              placeholder="Enter full name"
              data-i18n-placeholder="enterFullName"
              required
              class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all text-sm font-medium"
            />
          </div>
          <div>
            <label
              for="farmerPhone"
              class="block text-sm font-medium text-[#181D17] mb-1"
              data-i18n="phone"
              >Phone Number</label
            >
            <div class="phone-prefix-wrapper">
              <span class="phone-prefix-tag">🇮🇳 +91</span>
              <input
                id="farmerPhone"
                name="farmerPhone"
                type="tel"
                maxlength="10"
                inputmode="numeric"
                placeholder="Enter 10-digit number"
                data-i18n-placeholder="enterPhone"
                required
                class="w-full h-12 phone-input-padded rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all text-sm font-medium"
              />
            </div>
          </div>
          <div>
            <label
              for="farmerPassword"
              class="block text-sm font-medium text-[#181D17] mb-1"
              data-i18n="password"
              >Password</label
            >
            <div class="password-wrap">
              <input
                id="farmerPassword"
                name="farmerPassword"
                type="password"
                placeholder="Create password"
                data-i18n-placeholder="createPasswordPlaceholder"
                required
                class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all text-sm font-medium"
              />
              <button
                type="button"
                class="password-toggle"
                data-target="farmerPassword"
                aria-label="Show password"
              >
                👁️
              </button>
            </div>
          </div>
          <div>
            <label
              for="farmerConfirmPassword"
              class="block text-sm font-medium text-[#181D17] mb-1"
              data-i18n="confirmPassword"
              >Confirm Password</label
            >
            <input
              id="farmerConfirmPassword"
              name="farmerConfirmPassword"
              type="password"
              placeholder="Confirm password"
              data-i18n-placeholder="confirmPasswordPlaceholder"
              required
              class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all text-sm font-medium"
            />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label
                for="farmerDistrict"
                class="block text-sm font-medium text-[#181D17] mb-1"
                data-i18n="district"
                >District</label
              >
              <input
                id="farmerDistrict"
                name="farmerDistrict"
                type="text"
                placeholder="Enter district"
                data-i18n-placeholder="enterDistrict"
                required
                class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all text-sm font-medium"
              />
            </div>
            <div>
              <label
                for="farmerState"
                class="block text-sm font-medium text-[#181D17] mb-1"
                data-i18n="state"
                >State</label
              >
              <input
                id="farmerState"
                name="farmerState"
                type="text"
                placeholder="Enter state (e.g. Uttar Pradesh)"
                data-i18n-placeholder="enterState"
                required
                class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all text-sm font-medium"
              />
            </div>
          </div>
          <button
            type="submit"
            class="register-submit w-full min-h-[48px] mt-2 rounded-xl bg-gradient-to-r from-[#0D631B] to-[#2E9E4F] text-white font-bold shadow-md hover:shadow-lg transition-all"
            data-i18n="createFarmerAccount"
          >
            Create Farmer Account
          </button>
        </form>

        <!-- BUYER REGISTRATION FORM -->
        <form id="buyerForm" class="flex flex-col gap-4 hidden">
          <div>
            <label
              for="buyerName"
              class="block text-sm font-medium text-[#181D17] mb-1"
              data-i18n="companyOrFullName"
              >Company / Full Name</label
            >
            <input
              id="buyerName"
              name="buyerName"
              type="text"
              placeholder="Enter company or name"
              data-i18n-placeholder="enterCompanyOrName"
              required
              class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all text-sm font-medium"
            />
          </div>
          <div>
            <label
              for="buyerPhone"
              class="block text-sm font-medium text-[#181D17] mb-1"
              data-i18n="phone"
              >Phone Number</label
            >
            <div class="phone-prefix-wrapper">
              <span class="phone-prefix-tag">🇮🇳 +91</span>
              <input
                id="buyerPhone"
                name="buyerPhone"
                type="tel"
                maxlength="10"
                inputmode="numeric"
                placeholder="Enter 10-digit number"
                data-i18n-placeholder="enterPhone"
                required
                class="w-full h-12 phone-input-padded rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all text-sm font-medium"
              />
            </div>
          </div>
          <div>
            <label
              for="buyerPassword"
              class="block text-sm font-medium text-[#181D17] mb-1"
              data-i18n="password"
              >Password</label
            >
            <div class="password-wrap">
              <input
                id="buyerPassword"
                name="buyerPassword"
                type="password"
                placeholder="Create password"
                data-i18n-placeholder="createPasswordPlaceholder"
                required
                class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all text-sm font-medium"
              />
              <button
                type="button"
                class="password-toggle"
                data-target="buyerPassword"
                aria-label="Show password"
              >
                👁️
              </button>
            </div>
          </div>
          <div>
            <label
              for="buyerConfirmPassword"
              class="block text-sm font-medium text-[#181D17] mb-1"
              data-i18n="confirmPassword"
              >Confirm Password</label
            >
            <input
              id="buyerConfirmPassword"
              name="buyerConfirmPassword"
              type="password"
              placeholder="Confirm password"
              data-i18n-placeholder="confirmPasswordPlaceholder"
              required
              class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all text-sm font-medium"
            />
          </div>
          <div>
            <label
              for="businessName"
              class="block text-sm font-medium text-[#181D17] mb-1"
              data-i18n="businessName"
              >Business Name</label
            >
            <input
              id="businessName"
              name="businessName"
              type="text"
              placeholder="Enter business name"
              data-i18n-placeholder="enterBusinessName"
              required
              class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all text-sm font-medium"
            />
          </div>
          <div>
            <label
              for="businessType"
              class="block text-sm font-medium text-[#181D17] mb-1"
              data-i18n="businessType"
              >Business Type</label
            >
            <select
              id="businessType"
              name="businessType"
              required
              class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all bg-white text-sm font-medium"
            >
              <option value="" data-i18n="selectBusinessType">Select business type</option>
              <option value="retailer" data-i18n="retailer">Retailer</option>
              <option value="wholesaler" data-i18n="wholesaler">Wholesaler</option>
              <option value="trader" data-i18n="trader">Trader</option>
              <option value="exporter" data-i18n="exporter">Exporter</option>
            </select>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label
                for="buyerDistrict"
                class="block text-sm font-medium text-[#181D17] mb-1"
                data-i18n="district"
                >District</label
              >
              <input
                id="buyerDistrict"
                name="buyerDistrict"
                type="text"
                placeholder="Enter district"
                data-i18n-placeholder="enterDistrict"
                required
                class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all text-sm font-medium"
              />
            </div>
            <div>
              <label
                for="buyerState"
                class="block text-sm font-medium text-[#181D17] mb-1"
                data-i18n="state"
                >State</label
              >
              <input
                id="buyerState"
                name="buyerState"
                type="text"
                placeholder="Enter state (e.g. Uttar Pradesh)"
                data-i18n-placeholder="enterState"
                required
                class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all text-sm font-medium"
              />
            </div>
          </div>
          <button
            type="submit"
            class="register-submit w-full min-h-[48px] mt-2 rounded-xl bg-gradient-to-r from-[#75584D] to-[#9b7b6c] text-white font-bold shadow-md hover:shadow-lg transition-all"
            data-i18n="createBuyerAccount"
          >
            Create Buyer Account
          </button>
        </form>

        <div class="mt-6 text-center text-sm text-[#40493D]">
          <span data-i18n="alreadyHaveAccount">Already have an account?</span>
          <a
            href="./login.html"
            class="font-semibold text-[#0D631B] hover:underline ml-1"
            data-i18n="login"
            >Login</a
          >
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
