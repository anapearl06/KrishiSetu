<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSetu | Create Account</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body
    id="registerPage"
    class="register-page min-h-screen bg-[#F4F8F0] text-[#181D17] transition-colors duration-500"
  >
    <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
      <img
        src="./assets/images/background.png"
        alt=""
        class="register-background-image absolute inset-0 w-full h-full object-cover opacity-45"
      />
      <div
        id="registerBackgroundOverlay"
        class="absolute inset-0 bg-[#F4F8F0]/55 backdrop-blur-sm transition-colors duration-500"
      ></div>
    </div>

    <header
      class="fixed top-0 z-50 w-full h-16 bg-[#FAFAF5]/95 backdrop-blur-sm border-b border-[#E0E4DA] shadow-sm"
    >
      <div class="h-full px-4 md:px-8 flex items-center justify-between gap-4">
        <a
          href="./index.html"
          class="flex items-center gap-3 shrink-0 transition-transform duration-200 hover:scale-[1.02]"
        >
          <img
            src="./assets/images/krishisetu_logo.png"
            alt="KrishiSetu Logo"
            class="h-8 w-8 object-contain"
          />
          <span class="text-xl font-bold text-[#0D631B]">KrishiSetu</span>
        </a>
      </div>
    </header>

    <main
      class="min-h-screen flex items-center justify-center pt-24 pb-12 px-4"
    >
      <div
        id="registerCard"
        class="register-card w-full max-w-md bg-white rounded-xl border border-[#BFCABA]/60 shadow-sm p-6 md:p-8 transition-all duration-500"
      >
        <div class="text-center mb-8">
          <h1
            id="registerTitle"
            class="text-2xl md:text-3xl font-semibold text-[#1E1E1E] mb-2"
          >
            Create an Account
          </h1>
          <p class="text-base text-[#40493D]">Join the agricultural network</p>
        </div>

        <div
          class="flex mb-6 bg-[#F1F5EB] rounded-lg p-1 gap-1 transition-colors duration-500"
          id="registerTabs"
        >
          <button
            id="registerFarmerTab"
            type="button"
            class="register-role-tab active flex-1 min-h-[44px] rounded-md px-4 py-2 text-sm font-semibold transition-all duration-200"
          >
            Farmer
          </button>
          <button
            id="registerBuyerTab"
            type="button"
            class="register-role-tab flex-1 min-h-[44px] rounded-md px-4 py-2 text-sm font-medium transition-all duration-200"
          >
            Buyer
          </button>
        </div>

        <form id="farmerForm" class="flex flex-col gap-4">
          <div>
            <label
              for="farmerName"
              class="block text-sm font-medium text-[#181D17] mb-1"
              >Full Name</label
            >
            <input
              id="farmerName"
              name="farmerName"
              type="text"
              placeholder="Enter full name"
              required
              class="w-full h-12 px-4 rounded-md border border-[#BFCABA] outline-none"
            />
          </div>
          <div>
            <label
              for="farmerPhone"
              class="block text-sm font-medium text-[#181D17] mb-1"
              >Phone Number</label
            >
            <input
              id="farmerPhone"
              name="farmerPhone"
              type="tel"
              maxlength="10"
              placeholder="Enter phone number"
              required
              class="w-full h-12 px-4 rounded-md border border-[#BFCABA] outline-none"
            />
          </div>
          <div>
            <label
              for="farmerPassword"
              class="block text-sm font-medium text-[#181D17] mb-1"
              >Password</label
            >
            <input
              id="farmerPassword"
              name="farmerPassword"
              type="password"
              placeholder="Create password"
              required
              class="w-full h-12 px-4 rounded-md border border-[#BFCABA] outline-none"
            />
          </div>
          <div>
            <label
              for="farmerConfirmPassword"
              class="block text-sm font-medium text-[#181D17] mb-1"
              >Confirm Password</label
            >
            <input
              id="farmerConfirmPassword"
              name="farmerConfirmPassword"
              type="password"
              placeholder="Confirm password"
              required
              class="w-full h-12 px-4 rounded-md border border-[#BFCABA] outline-none"
            />
          </div>
          <button
            type="submit"
            class="w-full min-h-[48px] mt-2 rounded-md bg-[#0D631B] text-white font-semibold shadow-sm hover:bg-[#095516] transition-colors"
          >
            Create Farmer Account
          </button>
        </form>

        <form id="buyerForm" class="flex flex-col gap-4 hidden">
          <div>
            <label
              for="buyerName"
              class="block text-sm font-medium text-[#181D17] mb-1"
              >Company / Full Name</label
            >
            <input
              id="buyerName"
              name="buyerName"
              type="text"
              placeholder="Enter company or name"
              required
              class="w-full h-12 px-4 rounded-md border border-[#BFCABA] outline-none"
            />
          </div>
          <div>
            <label
              for="buyerPhone"
              class="block text-sm font-medium text-[#181D17] mb-1"
              >Phone Number</label
            >
            <input
              id="buyerPhone"
              name="buyerPhone"
              type="tel"
              maxlength="10"
              placeholder="Enter phone number"
              required
              class="w-full h-12 px-4 rounded-md border border-[#BFCABA] outline-none"
            />
          </div>
          <div>
            <label
              for="buyerPassword"
              class="block text-sm font-medium text-[#181D17] mb-1"
              >Password</label
            >
            <input
              id="buyerPassword"
              name="buyerPassword"
              type="password"
              placeholder="Create password"
              required
              class="w-full h-12 px-4 rounded-md border border-[#BFCABA] outline-none"
            />
          </div>
          <div>
            <label
              for="buyerConfirmPassword"
              class="block text-sm font-medium text-[#181D17] mb-1"
              >Confirm Password</label
            >
            <input
              id="buyerConfirmPassword"
              name="buyerConfirmPassword"
              type="password"
              placeholder="Confirm password"
              required
              class="w-full h-12 px-4 rounded-md border border-[#BFCABA] outline-none"
            />
          </div>
          <button
            type="submit"
            class="w-full min-h-[48px] mt-2 rounded-md bg-[#75584D] text-white font-semibold shadow-sm hover:bg-[#5c443b] transition-colors"
          >
            Create Buyer Account
          </button>
        </form>

        <div class="mt-6 text-center text-sm text-[#40493D]">
          Already have an account?
          <a
            href="./login.html"
            class="font-semibold text-[#0D631B] hover:underline"
            >Login</a
          >
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
