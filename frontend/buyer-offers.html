<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSetu | My Offers (Buyer)</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[#F4F8F0] text-[#181D17] font-['Inter'] min-h-screen flex flex-col lg:flex-row"
  >
    <!-- DESKTOP SIDEBAR -->
    <aside
      class="hidden lg:flex flex-col w-64 sidebar-glass border-r border-[#CDBDB4]/50 min-h-screen p-5 fixed left-0 top-0 bottom-0 z-40 ksetu-slide-in"
    >
      <a href="./index.html" class="brand flex items-center gap-3 mb-8 px-2">
        <img
          src="./assets/images/krishisetu_logo.png"
          alt="Logo"
          class="brand-logo w-10 h-10"
        />
        <span class="brand-name brand-name-warm text-xl font-bold">KrishiSetu</span>
      </a>
      <!-- LANGUAGE SWITCHER IN SIDEBAR -->
      <div class="mb-4 px-2">
        <div class="lang-switcher warm w-full justify-between">
          <button type="button" class="lang-btn active flex-1 justify-center" data-lang="en">EN</button>
          <button type="button" class="lang-btn flex-1 justify-center" data-lang="hi">हिन्दी</button>
        </div>
      </div>

      <nav class="flex flex-col gap-2 flex-1">
        <a
          href="./buyer-dashboard.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">📊</span> <span data-i18n="dashboard">Dashboard</span>
        </a>
        <a
          href="./browse-produce.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">🌾</span> <span data-i18n="browseProduce">Browse Produce</span>
        </a>
        <a
          href="./buyer-demands.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">📢</span> <span data-i18n="buyerDemands">My Demands</span>
        </a>
        <a
          href="./buyer-offers.html"
          class="nav-item-warm active flex items-center gap-3 px-4 py-3 rounded-xl font-medium shadow-sm"
        >
          <span class="text-lg">🤝</span> <span data-i18n="sentOffers">My Sent Offers</span>
        </a>
        <a
          href="./buyer-orders.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">🚚</span> <span data-i18n="myOrders">My Orders</span>
        </a>
      </nav>
      <div
        class="border-t border-[#CDBDB4]/50 pt-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-full bg-gradient-to-br from-[#75584D] to-[#9b7b6c] flex items-center justify-center font-bold text-white"
            id="sidebarAvatar"
          >
            B
          </div>
          <div>
            <p class="text-sm font-semibold text-[#181D17]" id="sidebarUserName">Buyer</p>
            <p class="text-xs text-[#40493D]" id="sidebarUserRole" data-i18n="buyerAccount">Buyer Account</p>
          </div>
        </div>
        <a
          href="./login.html"
          class="sidebar-logout text-xs text-red-600 font-medium hover:underline"
          data-i18n="logout"
          >Logout</a
        >
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 lg:ml-64 pb-20 lg:pb-8">
      <header
        class="bg-white/90 backdrop-blur-xl border-b border-[#CDBDB4]/50 sticky top-0 z-30 px-4 md:px-8 py-5 flex items-center justify-between gap-4"
      >
        <div>
          <h1 class="text-2xl md:text-3xl font-bold gradient-text-warm" data-i18n="sentOffers">
            My Sent Offers
          </h1>
          <p class="text-sm text-[#40493D] mt-1">
            Track status of custom bids sent to farmers
          </p>
        </div>
        <div class="flex items-center gap-3">
          <div class="lang-switcher warm lg:hidden">
            <button type="button" class="lang-btn active" data-lang="en">EN</button>
            <button type="button" class="lang-btn" data-lang="hi">हि</button>
          </div>
          <a
            href="./browse-produce.html"
            class="btn-warm hidden sm:inline-flex items-center gap-2 text-white text-sm font-bold px-4 sm:px-5 py-2.5 rounded-xl"
          >
            <span>🔍</span> <span data-i18n="browseProduce">Browse & Bid</span>
          </a>
        </div>
      </header>

      <main class="max-w-7xl mx-auto px-4 md:px-8 py-6">
        <div id="buyerOffersList" class="space-y-4">
          <!-- Populated dynamically via script.js -->
        </div>
      </main>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav
      class="lg:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-[#CDBDB4]/50 z-40 flex justify-around py-2.5 px-2 text-center text-xs shadow-[0_-4px_20px_rgba(0,0,0,0.08)]"
    >
      <a
        href="./buyer-dashboard.html"
        class="flex flex-col items-center text-[#75584D]"
      >
        <span class="text-base">📊</span> Home
      </a>
      <a
        href="./browse-produce.html"
        class="flex flex-col items-center text-[#40493D]"
      >
        <span class="text-base">🌾</span> Browse
      </a>
      <a
        href="./buyer-offers.html"
        class="flex flex-col items-center text-[#75584D] font-bold"
      >
        <span class="text-base">🤝</span> Offers
      </a>
      <a
        href="./buyer-orders.html"
        class="flex flex-col items-center text-[#40493D]"
      >
        <span class="text-base">🚚</span> Orders
      </a>
    </nav>

    <script src="./script.js"></script>
  </body>
</html>
