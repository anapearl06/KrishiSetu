<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSetu | Login</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    id="loginPage"
    class="login-page min-h-screen flex items-center justify-center relative overflow-x-hidden bg-[#F4F8F0] text-[#181D17] font-['Inter'] transition-colors duration-500"
  >
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
      <img
        src="./assets/images/background.png"
        alt=""
        class="login-background-image absolute inset-0 w-full h-full object-cover opacity-45"
      />
      <div
        id="loginBackgroundOverlay"
        class="absolute inset-0 bg-[#F4F8F0]/55 transition-colors duration-500"
      ></div>
      <div id="farmScenery" class="farm-scenery"></div>
      <div class="empower-blob b1"></div>
      <div class="empower-blob b2"></div>
    </div>

    <main class="auth-outer relative z-10 py-10 sm:py-14">
      <div class="text-center mb-7 sm:mb-8">
        <div class="flex justify-center mb-4">
          <img
            src="./assets/images/krishisetu_logo.png"
            alt="KrishiSetu Logo"
            class="login-logo"
          />
        </div>
        <h1
          id="loginBrand"
          class="brand-name text-[32px] md:text-[44px] leading-tight font-bold mb-2 transition-colors duration-500"
        >
          KrishiSetu
        </h1>
        <p class="text-base leading-relaxed text-[#40493D]">
          Agriculture Simplified
        </p>
      </div>

      <div
        id="loginCard"
        class="login-card auth-panel border-[#BFCABA]/50 overflow-hidden transition-all duration-500"
      >
        <div id="loginTabs" class="flex border-b border-[#BFCABA]/40">
          <button
            id="loginFarmerTab"
            type="button"
            class="role-tab active flex-1 py-4 px-3 text-center text-sm font-bold transition-all duration-200"
          >
            Farmer
          </button>
          <button
            id="loginBuyerTab"
            type="button"
            class="role-tab flex-1 py-4 px-3 text-center text-sm font-medium transition-all duration-200"
          >
            Buyer
          </button>
        </div>

        <div class="auth-pad">
          <h2
            id="loginTitle"
            class="auth-title font-semibold text-[#181D17] mb-6"
          >
            Farmer Login
          </h2>

          <form id="farmerLoginForm" class="flex flex-col gap-4">
            <div>
              <label
                for="farmerPhone"
                class="block text-sm font-medium text-[#181D17] mb-1"
                >Phone Number</label
              >
              <input
                id="farmerPhone"
                type="tel" 
                maxlength="10"
                placeholder="Enter phone number"
                required
                class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all"
              />
            </div>
            <div>
              <label
                for="farmerPassword"
                class="block text-sm font-medium text-[#181D17] mb-1"
                >Password</label
              >
              <div class="password-wrap">
                <input
                  id="farmerPassword"
                  type="password"
                  placeholder="Enter password"
                  required
                  class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#0D631B]/20 transition-all"
                />
                <button
                  type="button"
                  class="password-toggle"
                  data-target="farmerPassword"
                  aria-label="Show password"
                >
                  👁️
                </button>
              </div>
            </div>
            <button
              type="submit"
              class="login-submit w-full h-12 bg-gradient-to-r from-[#0D631B] to-[#2E9E4F] text-white font-bold rounded-xl shadow-sm transition-all"
            >
              Login as Farmer
            </button>
          </form>

          <form id="buyerLoginForm" class="flex flex-col gap-4 hidden">
            <div>
              <label
                for="buyerPhone"
                class="block text-sm font-medium text-[#181D17] mb-1"
                >Phone / Email</label
              >
              <input
                id="buyerPhone"
                type="text"
                placeholder="Enter phone or email"
                required
                class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all"
              />
            </div>
            <div>
              <label
                for="buyerPassword"
                class="block text-sm font-medium text-[#181D17] mb-1"
                >Password</label
              >
              <div class="password-wrap">
                <input
                  id="buyerPassword"
                  type="password"
                  placeholder="Enter password"
                  required
                  class="w-full h-12 px-4 rounded-xl border border-[#BFCABA] outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all"
                />
                <button
                  type="button"
                  class="password-toggle"
                  data-target="buyerPassword"
                  aria-label="Show password"
                >
                  👁️
                </button>
              </div>
            </div>
            <button
              type="submit"
              class="login-submit w-full h-12 bg-gradient-to-r from-[#75584D] to-[#9b7b6c] text-white font-bold rounded-xl shadow-sm transition-all"
            >
              Login as Buyer
            </button>
          </form>

          <div class="mt-6 text-center text-sm text-[#40493D]">
            <span>Don't have an account? </span>
            <a
              id="loginRegisterLink"
              href="./register.html?role=farmer"
              class="font-bold text-[#0D631B] hover:underline"
              >Register</a
            >
          </div>
        </div>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
