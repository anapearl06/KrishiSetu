<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSetu | My Demands</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[#F4F8F0] text-[#181D17] font-['Inter'] min-h-screen flex flex-col lg:flex-row"
  >
    <!-- DESKTOP SIDEBAR -->
    <aside
      class="hidden lg:flex flex-col w-64 bg-white border-r border-[#E0E4DA] min-h-screen p-5 fixed left-0 top-0 bottom-0 z-40"
    >
      <a href="./index.html" class="flex items-center gap-3 mb-8 px-2">
        <img
          src="./assets/images/krishisetu_logo.png"
          alt="Logo"
          class="h-9 w-9 object-contain"
        />
        <span class="text-xl font-bold text-[#0D631B]">KrishiSetu</span>
      </a>
      <nav class="flex flex-col gap-2 flex-1">
        <a
          href="./buyer-dashboard.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-[#40493D] hover:bg-[#F1F5EB] font-medium"
        >
          <span>📊</span> Dashboard
        </a>
        <a
          href="./browse-produce.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-[#40493D] hover:bg-[#F1F5EB] font-medium"
        >
          <span>🌾</span> Browse Produce
        </a>
        <a
          href="./buyer-demands.html"
          class="flex items-center gap-3 px-4 py-3 rounded-lg bg-[#0D631B] text-white font-medium shadow-sm"
        >
          <span>📢</span> My Demands
        </a>
      </nav>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 lg:ml-64 pb-20 lg:pb-8">
      <header
        class="bg-white/90 backdrop-blur-sm border-b border-[#E0E4DA] sticky top-0 z-30 px-4 md:px-8 py-4 flex items-center justify-between"
      >
        <div>
          <h1 class="text-xl md:text-2xl font-bold text-[#181D17]">
            My Demands
          </h1>
          <p class="text-xs md:text-sm text-[#40493D]">
            Post crop requirements and let farmers connect with you
          </p>
        </div>
        <button
          onclick="openDemandDrawer()"
          class="bg-[#0D631B] text-white font-medium px-4 py-2.5 rounded-lg shadow-sm hover:bg-[#095516] text-sm"
        >
          + Post Requirement
        </button>
      </header>

      <main class="max-w-7xl mx-auto px-4 md:px-8 py-6">
        <!-- DEMANDS GRID -->
        <div
          id="demandsGrid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
        >
          <!-- Populated via script.js -->
        </div>
      </main>
    </div>

    <!-- CREATE DEMAND DRAWER (F16) -->
    <div
      id="demandDrawerBackdrop"
      class="fixed inset-0 bg-black/50 z-50 hidden opacity-0 transition-opacity"
    ></div>
    <div
      id="createDemandDrawer"
      class="fixed inset-y-0 right-0 w-full sm:w-[480px] bg-white z-50 shadow-2xl transform translate-x-full transition-transform flex flex-col"
    >
      <div
        class="p-5 border-b border-[#E0E4DA] flex items-center justify-between bg-[#FAFAF5]"
      >
        <h2 class="text-xl font-bold text-[#0D631B]">Post Crop Requirement</h2>
        <button
          onclick="closeDemandDrawer()"
          class="text-lg font-bold text-gray-500"
        >
          ✕
        </button>
      </div>

      <form id="createDemandForm" class="flex-1 overflow-y-auto p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-[#40493D] mb-1"
            >Crop Name</label
          >
          <input
            type="text"
            id="demandCrop"
            required
            placeholder="e.g. Mustard, Wheat, Paddy"
            class="w-full h-10 px-3 border border-[#E0E4DA] rounded-lg text-sm"
          />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-[#40493D] mb-1"
              >Quantity</label
            >
            <input
              type="number"
              id="demandQuantity"
              required
              placeholder="500"
              class="w-full h-10 px-3 border border-[#E0E4DA] rounded-lg text-sm"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#40493D] mb-1"
              >Unit</label
            >
            <select
              id="demandUnit"
              class="w-full h-10 px-3 border border-[#E0E4DA] rounded-lg text-sm bg-white"
            >
              <option value="quintal">Quintal</option>
              <option value="kg">Kg</option>
              <option value="ton">Ton</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#40493D] mb-1"
            >Max Budget Price per Unit (₹)</label
          >
          <input
            type="number"
            id="demandTargetPrice"
            required
            placeholder="e.g. 5200"
            class="w-full h-10 px-3 border border-[#E0E4DA] rounded-lg text-sm"
          />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-[#40493D] mb-1"
              >State</label
            >
            <input
              type="text"
              id="demandState"
              required
              placeholder="Uttar Pradesh"
              class="w-full h-10 px-3 border border-[#E0E4DA] rounded-lg text-sm"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#40493D] mb-1"
              >District / City</label
            >
            <input
              type="text"
              id="demandDistrict"
              required
              placeholder="Agra"
              class="w-full h-10 px-3 border border-[#E0E4DA] rounded-lg text-sm"
            />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#40493D] mb-1"
            >Quality / Specification Note</label
          >
          <textarea
            id="demandDescription"
            rows="3"
            placeholder="Need moisture content under 8%..."
            class="w-full p-3 border border-[#E0E4DA] rounded-lg text-sm"
          ></textarea>
        </div>
        <button
          type="submit"
          class="w-full h-11 bg-[#0D631B] text-white font-bold rounded-lg text-sm hover:bg-[#095516]"
        >
          Publish Requirement
        </button>
      </form>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
