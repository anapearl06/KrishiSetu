<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSetu | My Demands</title>
    <link rel="stylesheet" href="./output.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[#F4F8F0] text-[#181D17] font-['Inter'] min-h-screen flex flex-col lg:flex-row"
  >
    <!-- DESKTOP SIDEBAR -->
    <aside
      class="hidden lg:flex flex-col w-64 sidebar-glass border-r border-[#CDBDB4]/50 min-h-screen p-5 fixed left-0 top-0 bottom-0 z-40 ksetu-slide-in"
    >
      <a href="./index.html" class="brand flex items-center gap-3 mb-8 px-2">
        <img
          src="./assets/images/krishisetu_logo.png"
          alt="Logo"
          class="brand-logo w-10 h-10"
        />
        <span class="brand-name brand-name-warm text-xl font-bold">KrishiSetu</span>
      </a>
      <nav class="flex flex-col gap-2 flex-1">
        <a
          href="./buyer-dashboard.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">📊</span> Dashboard
        </a>
        <a
          href="./browse-produce.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">🌾</span> Browse Produce
        </a>
        <a
          href="./buyer-demands.html"
          class="nav-item-warm active flex items-center gap-3 px-4 py-3 rounded-xl font-medium shadow-sm"
        >
          <span class="text-lg">📢</span> My Demands
        </a>
        <a
          href="./buyer-offers.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">🤝</span> My Sent Offers
        </a>
        <a
          href="./buyer-orders.html"
          class="nav-item-warm flex items-center gap-3 px-4 py-3 rounded-xl text-[#40493D] font-medium"
        >
          <span class="text-lg">📦</span> My Orders
        </a>
      </nav>
      <div
        class="border-t border-[#CDBDB4]/50 pt-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-full bg-gradient-to-br from-[#75584D] to-[#9b7b6c] flex items-center justify-center font-bold text-white"
          >
            A
          </div>
          <div>
            <p class="text-sm font-semibold text-[#181D17]">Apex Retailers</p>
            <p class="text-xs text-[#40493D]">Buyer Account</p>
          </div>
        </div>
        <a
          href="./login.html"
          class="text-xs text-red-600 font-medium hover:underline"
          >Logout</a
        >
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 lg:ml-64 pb-20 lg:pb-8">
      <header
        class="bg-white/90 backdrop-blur-xl border-b border-[#CDBDB4]/50 sticky top-0 z-30 px-4 md:px-8 py-5 flex items-center justify-between"
      >
        <div>
          <h1 class="text-2xl md:text-3xl font-bold gradient-text-warm">
            My Demands
          </h1>
          <p class="text-sm text-[#40493D] mt-1">
            Post crop requirements and let farmers connect with you
          </p>
        </div>
        <button
          onclick="openDemandDrawer()"
          class="btn-warm text-white font-medium px-5 py-3 rounded-xl shadow-lg text-sm flex items-center gap-2"
        >
          <span>➕</span> Post Requirement
        </button>
      </header>

      <main class="max-w-7xl mx-auto px-4 md:px-8 py-6">
        <!-- DEMANDS GRID -->
        <div
          id="demandsGrid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
        >
          <!-- Populated via script.js -->
        </div>
      </main>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav
      class="lg:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-[#CDBDB4]/50 z-40 flex justify-around py-2.5 px-2 text-center text-xs shadow-[0_-4px_20px_rgba(0,0,0,0.08)]"
    >
      <a
        href="./buyer-dashboard.html"
        class="flex flex-col items-center text-[#75584D]"
      >
        <span class="text-base">📊</span> Home
      </a>
      <a
        href="./browse-produce.html"
        class="flex flex-col items-center text-[#40493D]"
      >
        <span class="text-base">🌾</span> Browse
      </a>
      <a
        href="./buyer-demands.html"
        class="flex flex-col items-center text-[#75584D] font-bold"
      >
        <span class="text-base">📢</span> Demands
      </a>
      <a
        href="./buyer-orders.html"
        class="flex flex-col items-center text-[#40493D]"
      >
        <span class="text-base">📦</span> Orders
      </a>
    </nav>

    <!-- CREATE DEMAND DRAWER (F16) -->
    <div
      id="demandDrawerBackdrop"
      class="fixed inset-0 bg-black/50 z-50 hidden opacity-0 transition-opacity"
    ></div>
    <div
      id="createDemandDrawer"
      class="fixed inset-y-0 right-0 w-full sm:w-[480px] sidebar-glass z-50 shadow-2xl transform translate-x-full transition-transform flex flex-col"
    >
      <div
        class="p-5 border-b border-[#CDBDB4]/50 flex items-center justify-between bg-gradient-to-r from-white to-[#FAFAF5]"
      >
        <div>
          <h2 class="text-xl font-bold gradient-text-warm">Post Crop Requirement</h2>
          <p class="text-xs text-[#40493D]">Farmers will see your demand</p>
        </div>
        <button
          onclick="closeDemandDrawer()"
          class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center font-bold text-gray-500 transition-all duration-200 hover:scale-110"
        >
          ✕
        </button>
      </div>

      <form id="createDemandForm" class="flex-1 overflow-y-auto p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-[#40493D] mb-1"
            >Crop Name</label
          >
          <input
            type="text"
            id="demandCrop"
            required
            placeholder="e.g. Mustard, Wheat, Paddy"
            class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all"
          />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-[#40493D] mb-1"
              >Quantity</label
            >
            <input
              type="number"
              id="demandQuantity"
              required
              placeholder="500"
              class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#40493D] mb-1"
              >Unit</label
            >
            <select
              id="demandUnit"
              class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all"
            >
              <option value="quintal">Quintal</option>
              <option value="kg">Kg</option>
              <option value="ton">Ton</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#40493D] mb-1"
            >Max Budget Price per Unit (₹)</label
          >
          <input
            type="number"
            id="demandTargetPrice"
            required
            placeholder="e.g. 5200"
            class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all"
          />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-[#40493D] mb-1"
              >State</label
            >
            <input
              type="text"
              id="demandState"
              required
              placeholder="Uttar Pradesh"
              class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#40493D] mb-1"
              >District / City</label
            >
            <input
              type="text"
              id="demandDistrict"
              required
              placeholder="Agra"
              class="w-full h-11 px-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all"
            />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-[#40493D] mb-1"
            >Quality / Specification Note</label
          >
          <textarea
            id="demandDescription"
            rows="3"
            placeholder="Need moisture content under 8%..."
            class="w-full p-3 border border-[#E0E4DA] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#75584D]/20 transition-all"
          ></textarea>
        </div>
        <button
          type="submit"
          class="btn-warm w-full h-12 text-white font-bold rounded-xl text-sm shadow-lg flex items-center justify-center gap-2"
        >
          🚀 Publish Requirement
        </button>
      </form>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
